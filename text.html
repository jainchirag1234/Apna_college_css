<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p style="color:red">Paragraph with red color.</p>
    <p style="direction: rtl;">Paragraph right to left</p>
    <p style="letter-spacing: 5px;">Paragraph with letter spacing 5px</p>
    <p style="word-spacing: 5px;">Paragraph with word spacing 5px</p>
    <p style="text-indent: 1cm;">Paragraph with text indent 1 cm</p>
    <p style="text-shadow: 6px 8px blue;">This is text with shadow</p>
</body>
</html>
